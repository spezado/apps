# Licence and copyright of files that cannot carry a header (REUSE specification 3.3). Source files name their own
# licence in an SPDX header.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the spezado contributors"
SPDX-License-Identifier = "MIT"

# Copies of the brand's artwork from spezado/brand – to be passed on unchanged; name and brand are falkOSS's.
[[annotations]]
path = ["assets/brand/**", "macos/Runner/Assets.xcassets/AppIcon.appiconset/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G."
SPDX-License-Identifier = "CC-BY-ND-4.0"

[[annotations]]
path = "assets/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = ["2014, 2015 (URW)++ Design & Development", "2019-2020 Daniel Benjamin Miller"]
SPDX-License-Identifier = "OFL-1.1"
