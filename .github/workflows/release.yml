# SPDX-License-Identifier: MIT
# A release for a tag v*: the desktop app built per platform, packed with the licences, and published as a GitHub
# pre-release with checksums and the notes of CHANGELOG.md. Only the GitHub CLI of the runners is used beyond the
# actions of the CI, pinned by commit. The macOS app is not signed with a Developer ID (see README.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A draft release with the notes of this version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          grep -q "^version: $version+" pubspec.yaml || { echo "pubspec.yaml is not at $version"; exit 1; }
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --draft --verify-tag --title "spezado apps $version" --notes-file notes.md

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
          - platform: windows-x86_64
            runner: windows-latest
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          # Git Bash on Windows runs the batch file, not the shell script.
          if [[ "$RUNNER_OS" == Windows ]]; then echo "FLUTTER=flutter.bat" >> "$GITHUB_ENV"; else echo "FLUTTER=flutter" >> "$GITHUB_ENV"; fi
      - name: Libraries for Linux – GTK, and libsecret for the keychain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - run: $FLUTTER pub get --enforce-lockfile
      - name: Build, pack and upload, with a checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          name="spezado-app-${TAG#v}-$PLATFORM"
          mkdir "$name"
          cp -R LICENSE LICENSES README.md CHANGELOG.md "$name/"
          case "$PLATFORM" in
            macos)
              "$FLUTTER" build macos --release
              ditto build/macos/Build/Products/Release/spezado.app "$name/spezado.app"
              ditto -c -k --keepParent "$name" "$name.zip"
              archive="$name.zip" ;;
            windows-*)
              "$FLUTTER" build windows --release
              cp -R build/windows/x64/runner/Release/. "$name/"
              7z a -tzip "$name.zip" "$name" > /dev/null
              archive="$name.zip" ;;
            linux-*)
              "$FLUTTER" build linux --release
              arch=$([[ "$PLATFORM" == *arm64 ]] && echo arm64 || echo x64)
              cp -R "build/linux/$arch/release/bundle/." "$name/"
              tar -czf "$name.tar.gz" "$name"
              archive="$name.tar.gz" ;;
          esac
          if command -v sha256sum > /dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          gh release upload "$TAG" "$archive" "$archive.sha256"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
